[project]
name = "scripts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyrefly>=0.60.0",
]

[project.scripts]
backup-production-db = "backup_production_db:main"
upload-local-db-to-staging-db = "upload_local_db_to_staging_db:main"
upload-production-db-to-local = "upload_production_db_to_local:main"
upload-production-db-to-staging-db = "upload_production_db_to_staging_db:main"

[tool.pyrefly]
project-includes = [
    "**/*.py",
    "agency_management/py.typed",
]
